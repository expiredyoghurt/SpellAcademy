name = "spell-academy"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*", "/ws/*"]

[[d1_databases]]
binding = "DB"
database_name = "spell-academy"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[durable_objects.bindings]]
name = "DUEL"
class_name = "DuelRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DuelRoom"]
